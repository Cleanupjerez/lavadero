<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lavadero · Acceso</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;font-family:system-ui;color:#17212b}.box{width:min(410px,92%);margin:11vh auto;background:white;padding:27px;border-radius:22px;border:1px solid #e2e7ec;box-shadow:0 12px 35px #0001}.logo{font-size:26px;font-weight:900}.muted{font-size:12px;color:#697582}h1{font-size:22px;margin:28px 0 7px}label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}input{width:100%;padding:14px;border:1px solid #d7dde4;border-radius:12px;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#111827;color:white;font-weight:800}.err{margin-top:12px;background:#fff0ef;color:#a4261d;padding:10px;border-radius:10px;font-size:12px}</style></head><body><div class="box"><div class="logo">🚗 LAVADERO</div><div class="muted">Control de coches y tiempos</div><h1>Iniciar sesión</h1><form method="post"><label>Usuario</label><input name="username" autocomplete="username" required><label>Contraseña</label><input type="password" name="password" autocomplete="current-password" required><button>Entrar</button></form>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="err">{{m}}</div>{% endfor %}{% endwith %}<p class="muted">Primer acceso: admin / 1234</p></div></body></html>
