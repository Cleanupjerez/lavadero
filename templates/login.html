<!doctype html><html lang="es"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>Lavadero</title></head><body>
<div class="container" style="max-width:430px;padding-top:70px"><div class="card">
<h1 style="margin-top:0">🚗 Lavadero</h1><p style="color:#64748b">Acceso al sistema</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}
<form method="post"><label>Usuario</label><input name="username" autocomplete="username" required><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required><div style="height:14px"></div><button class="btn">ENTRAR</button></form>
</div></div></body></html>
