<!doctype html><html lang="es"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>Cambiar contraseña</title></head><body><div class="container" style="max-width:500px;padding-top:50px"><div class="card"><h1>🔐 Cambia tu contraseña</h1><p style="color:#64748b">Es obligatorio cambiar la contraseña inicial.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}
<form method="post"><label>Contraseña actual</label><input name="current_password" type="password" required><label>Nueva contraseña</label><input name="new_password" type="password" minlength="4" required><label>Repetir contraseña</label><input name="confirm_password" type="password" minlength="4" required><div style="height:14px"></div><button class="btn">GUARDAR Y CONTINUAR</button></form></div></div></body></html>
