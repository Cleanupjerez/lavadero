<!doctype html><html lang="es"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"></head><body><main class="container" style="max-width:500px;padding-top:45px"><div class="card"><h1>🔐 Cambia tu contraseña</h1><p style="color:#64748b">Obligatorio en el primer acceso · mínimo 4 caracteres</p>{% with m=get_flashed_messages() %}{% for x in m %}<div class="flash">{{x}}</div>{% endfor %}{% endwith %}<form method="post"><label>Contraseña actual</label><input name="current_password" type="password" required><label>Nueva contraseña</label><input name="new_password" type="password" minlength="4" required><label>Repetir nueva contraseña</label><input name="confirm_password" type="password" minlength="4" required><div style="height:14px"></div><button class="btn">GUARDAR Y CONTINUAR</button></form></div></main></body></html>
