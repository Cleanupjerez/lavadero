<!doctype html><html lang="es"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>Coches</title></head><body><header class="top"><h1>🚗 Historial de coches</h1></header><main class="container"><div class="card"><div style="overflow:auto"><table class="table"><tr><th>Matrícula</th><th>Servicio</th><th>Trabajador</th><th>Tiempo</th><th>Checklist</th></tr>{% for c in cars %}<tr><td><b>{{c[1]}}</b></td><td>{{c[5]}}</td><td>{{c[6]}}</td><td>{{'%.0f'|format(c[7]) if c[7] else '—'}} / {{c[8]}} min</td><td>{% if c[10]=='done' %}<span class="dot green">●</span>{% else %}<span class="dot red">●</span>{% endif %}</td></tr>{% endfor %}</table></div></div></main><nav class="nav"><a href="/admin">🏠<br>Resumen</a><a class="active" href="/admin/cars">🚗<br>Coches</a><a href="/admin/workers">👷<br>Trabajadores</a><a href="/admin/checklists">🔴<br>Checklist</a><a href="/logout">☰<br>Más</a></nav></body></html>
